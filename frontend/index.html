<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Yordamchi med</title>
    
    <!-- Brand Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="theme-color" content="#123C5C" />
    <meta name="description" content="Yordamchi med - Ijtimoiy himoya va maktab-internat hamkorlik tizimi" />

    <style>
      /* Prevent bounce scroll, zooming, and text selection for a native Mini App feel */
      html, body {
        overscroll-behavior-y: none;
        overscroll-behavior-x: none;
        -webkit-overflow-scrolling: touch;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        touch-action: pan-y;
        overflow: hidden; /* We'll let the React #root handle the internal scrolling */
      }
      
      /* Allow text selection in inputs and textareas */
      input, textarea {
        -webkit-user-select: auto;
        user-select: auto;
      }
      
      #root {
        height: 100vh;
        width: 100vw;
        overflow-y: auto;
        overscroll-behavior-y: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
