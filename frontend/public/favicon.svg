<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B6FA8" />
      <stop offset="100%" stop-color="#123C5C" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A52" />
      <stop offset="100%" stop-color="#E8734A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0a1a27" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="27" y="27" width="458" height="458" rx="113" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="4" />

  <!-- Heart Shape -->
  <path d="M 256 422 C 251 422 96 304 68 236 C 36 156 58 78 136 72 C 188 68 236 98 256 142 C 276 98 324 68 376 72 C 454 78 476 156 444 236 C 416 304 261 422 256 422 Z" 
        fill="url(#heartGrad)" filter="url(#shadow)" />

  <!-- Medical Cross inside Heart -->
  <rect x="176" y="238" width="160" height="54" rx="18" fill="#FFFFFF" />
  <rect x="229" y="185" width="54" height="160" rx="18" fill="#FFFFFF" />
</svg>
